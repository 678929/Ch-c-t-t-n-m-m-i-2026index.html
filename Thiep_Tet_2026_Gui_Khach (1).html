
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧧 Thiệp Tết 2026 - Nhận Lì Xì Ngay!</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #8B0000 0%, #B91C1C 100%);
            height: 100vh; display: flex; align-items: center; justify-content: center;
            color: white; overflow: hidden;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px 20px;
            border-radius: 20px;
            border: 2px solid #FDE047;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: float 3s ease-in-out infinite;
        }
        h1 { color: #FDE047; margin-bottom: 10px; font-size: 28px; text-transform: uppercase; }
        .icon { font-size: 60px; margin-bottom: 20px; display: block; }
        p { font-size: 16px; line-height: 1.6; opacity: 0.9; margin-bottom: 30px; }
        .btn {
            background: linear-gradient(to right, #FDE047, #F59E0B);
            color: #7F1D1D;
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 18px;
            display: inline-block;
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.4);
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>
    <div class="card">
        <span class="icon">🐎</span>
        <h1>Chúc Mừng Năm Mới<br>Bính Ngọ 2026</h1>
        <p>Bạn nhận được một <b>lượt bốc thăm túi mù</b> và lời chúc may mắn từ chúng tôi.</p>

        <p style="font-size: 12px; margin-top: 20px; opacity: 0.6">Bấm nút trên để truy cập ứng dụng</p>
    </div>
</body>
</html>
