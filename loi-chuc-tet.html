
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lộc Xuân Bính Ngọ 2026</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Quicksand:wght@400;600&display=swap');
      .font-tet-title { font-family: 'Playfair Display', serif; }
      .font-tet-script { font-family: 'Dancing Script', cursive; }
      .font-tet-body { font-family: 'Quicksand', sans-serif; }
      @keyframes bounce-slow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      .animate-bounce-slow { animation: bounce-slow 3s infinite; }
    </style>
</head>
<body class="bg-[#8B0000] text-white font-tet-body overflow-hidden h-screen select-none">
    
    <!-- Audio -->
    <audio id="bgMusic" loop>
        <source src="https://archive.org/download/ChineseNewYearMusic/Chinese%20New%20Year%20Music.mp3" type="audio/mpeg">
    </audio>

    <!-- Main App Container -->
    <div id="app" class="relative z-10 w-full h-full flex flex-col items-center justify-center p-4 max-w-md mx-auto">
        <!-- Content will be injected by JS -->
    </div>

    <!-- Background Decor (Inline SVG for portability) -->
    <div class="fixed inset-0 pointer-events-none opacity-10" style="background-image: url('data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\' %3E%3Cpath d=\'M30 0C13.4 0 0 13.4 0 30s13.4 30 30 30 30-13.4 30-30S46.6 0 30 0zm0 52C17.9 52 8 42.1 8 30S17.9 8 30 8s22 9.9 22 22-9.9 22-22 22zm-7-22h14v-4H23v4z\' fill=\'%23FDE047\' fill-opacity=\'0.4\'/%3E%3C/svg%3E'); background-size: 40px 40px;"></div>

    <script>
      // --- DATA ---
      const PRIZES = [
        { id: 'v10', name: 'Voucher Giảm 10% Thiết Kế', color: 'from-yellow-300 to-yellow-500', icon: '🏆', text: 'text-yellow-900', prob: 30 },
        { id: 'v5',  name: 'Voucher Giảm 5% Thiết Kế',  color: 'from-blue-300 to-blue-500',   icon: '💎', text: 'text-blue-900', prob: 80 },
        { id: 'lx',  name: 'Lì Xì May Mắn 20k',         color: 'from-red-400 to-red-600',     icon: '🧧', text: 'text-white', prob: 100 }
      ];
      const WISHES = {"Phòng Khách":"Tết này khách khứa đông vui,\nTiền vô như nước, lộc vùi trúng tim! 🛋️","Phòng Bếp":"Bếp hồng lửa ấm cơm ngon,\nGia đình hạnh phúc, vuông tròn cả năm! 🍳","Phòng Ngủ":"Ăn được ngủ được là tiên,\nNăm mới sức khỏe, bình yên mọi bề! 🛌","Phòng Game":"Leo rank thần tốc, gánh team,\nNăm mới thắng lớn, game nào cũng Win! 🎮","Sân Vườn":"Cây cối đâm chồi nảy lộc non,\nPhúc lộc dồi dào tựa núi non! 🌿","Ban Công":"Gió xuân phơi phới lùa khe cửa,\nTiền vào như gió, chẳng cần thưa! 🎐","Góc Làm Việc":"Công danh thăng tiến rạng rỡ màu,\nSự nghiệp vững vàng, bước lên cao! 💼"};
      
      // --- STATE ---
      let state = {
        screen: 'intro', // intro, selection, wishes, blindbag, result
        selectedRoom: null,
        prize: null,
        sound: true,
        played: false
      };

      // --- LOGIC ---
      function init() {
        const saved = localStorage.getItem('tet2026_prize_standalone');
        if (saved) {
          state.prize = JSON.parse(saved);
          state.played = true;
          setScreen('result');
        } else {
          render();
        }
        lucide.createIcons();
      }

      function setScreen(s) {
        state.screen = s;
        render();
        lucide.createIcons();
      }

      function playSound(type) {
        if(!state.sound) return;
        // Simple Audio mock for standalone simplicity or use real logic if needed
        // For portable HTML, let's rely on simple beep or just the music
      }
      
      function toggleMusic() {
        const bg = document.getElementById('bgMusic');
        state.sound = !state.sound;
        if(state.sound) bg.play().catch(e=>console.log(e));
        else bg.pause();
        render();
        lucide.createIcons();
      }

      function startGame() {
        document.getElementById('bgMusic').play().catch(e=>console.log(e));
        setScreen('selection');
      }

      function selectRoom(r) {
        state.selectedRoom = r;
        setScreen('wishes');
      }

      function drawPrize() {
        if(state.played) return;
        const r = Math.random() * 100;
        let p = PRIZES.find(x => r < x.prob) || PRIZES[2];
        
        state.prize = p;
        state.played = true;
        localStorage.setItem('tet2026_prize_standalone', JSON.stringify(p));
        setScreen('result');
      }

      function render() {
        const app = document.getElementById('app');
        let html = '';

        // Header Controls
        html += `
          <button onclick="toggleMusic()" class="absolute top-4 right-4 z-50 p-2 bg-black/20 rounded-full text-white">
            <i data-lucide="${state.sound ? 'volume-2' : 'volume-x'}"></i>
          </button>
        `;

        if (state.screen === 'intro') {
          html += `
            <div class="text-center space-y-6 animate-fade-in">
              <div class="relative w-48 h-48 mx-auto border-[6px] border-yellow-500 rounded-full flex items-center justify-center bg-red-800 shadow-[0_0_30px_rgba(234,179,8,0.5)]">
                 <div class="text-center">
                    <span class="text-7xl block animate-bounce-slow">🐎</span>
                    <span class="text-yellow-200 text-lg font-bold font-tet-title mt-2 block">2026</span>
                 </div>
              </div>
              <h1 class="text-4xl font-extrabold text-yellow-300 uppercase font-tet-title">Hái Lộc<br><span class="text-white text-3xl font-tet-script">Đầu Xuân</span></h1>
              <button onclick="startGame()" class="mt-8 bg-yellow-400 text-red-900 font-bold py-4 px-10 rounded-full shadow-lg flex items-center gap-2 mx-auto hover:scale-105 transition-transform">
                <i data-lucide="sparkles"></i> KHAI XUÂN
              </button>
            </div>
          `;
        } 
        
        else if (state.screen === 'selection') {
          const rooms = ['Phòng Khách', 'Phòng Bếp', 'Phòng Ngủ', 'Phòng Game', 'Sân Vườn', 'Ban Công', 'Góc Làm Việc'];
          const icons = {'Phòng Khách':'tv', 'Phòng Bếp':'utensils', 'Phòng Ngủ':'bed', 'Phòng Game':'gamepad-2', 'Sân Vườn':'flower-2', 'Ban Công':'wind', 'Góc Làm Việc':'briefcase'};
          
          html += `
            <h2 class="text-2xl font-bold text-yellow-300 mb-4 font-tet-title text-center">Chọn Góc Nhà</h2>
            <div class="grid grid-cols-2 gap-3 w-full max-h-[60vh] overflow-y-auto">
              ${rooms.map(r => `
                <button onclick="selectRoom('${r}')" class="bg-red-900/40 border border-red-500/30 p-3 rounded-xl flex flex-col items-center text-center hover:bg-red-800">
                  <div class="mb-2 text-yellow-200"><i data-lucide="${icons[r]}"></i></div>
                  <span class="text-sm font-bold uppercase">${r}</span>
                </button>
              `).join('')}
            </div>
          `;
        }

        else if (state.screen === 'wishes') {
          html += `
             <div class="bg-[#FFFBEB] text-red-900 p-8 rounded-sm shadow-2xl w-full text-center border-y-8 border-red-800 relative">
               <div class="mb-4 text-red-600 opacity-80 mx-auto w-8"><i data-lucide="scroll-text"></i></div>
               <h3 class="text-xl font-bold uppercase mb-4 text-red-800 border-b border-red-300 pb-2 inline-block font-tet-title">Lời Chúc ${state.selectedRoom}</h3>
               <p class="text-xl font-medium leading-relaxed whitespace-pre-line font-tet-script text-red-900">"${WISHES[state.selectedRoom]}"</p>
            </div>
            <div class="mt-8 w-full gap-3 flex flex-col">
               <button onclick="setScreen('blindbag')" class="bg-yellow-400 text-red-900 font-bold py-3 rounded-full flex items-center justify-center gap-2 animate-pulse"><i data-lucide="gift"></i> Nhận Lì Xì</button>
               <button onclick="setScreen('selection')" class="text-white/80 py-2 text-sm flex items-center justify-center gap-2"><i data-lucide="arrow-left"></i> Chọn lại</button>
            </div>
          `;
        }

        else if (state.screen === 'blindbag') {
          html += `
            <h2 class="text-3xl font-bold text-yellow-300 uppercase mb-6 font-tet-title text-center">Túi Lộc 2026</h2>
            <div class="grid grid-cols-2 gap-4 w-full">
               ${[1,2,3,4].map(i => `
                 <button onclick="drawPrize()" class="aspect-square bg-gradient-to-t from-red-700 to-red-600 rounded-xl border-2 border-yellow-400/30 flex flex-col items-center justify-center gap-2 hover:scale-105 transition-transform">
                   <div class="text-yellow-300"><i data-lucide="shopping-bag" size="40"></i></div>
                   <span class="font-bold text-yellow-100 text-xs uppercase">Túi ${i}</span>
                 </button>
               `).join('')}
            </div>
          `;
        }

        else if (state.screen === 'result') {
          const p = state.prize;
          html += `
            <h2 class="text-xl text-yellow-200 font-bold mb-6 uppercase tracking-widest font-tet-title text-center">Lộc Xuân Về Tay</h2>
            <div class="w-full bg-gradient-to-br ${p.color} p-1 rounded-2xl shadow-xl transform rotate-1 mb-8">
              <div class="bg-white/95 p-8 rounded-xl flex flex-col items-center border border-white/50 relative overflow-hidden text-center">
                <div class="text-6xl mb-4">${p.icon}</div>
                <h3 class="text-2xl font-extrabold ${p.text} mb-2 leading-tight font-tet-title">${p.name}</h3>
                <div class="mt-6 bg-red-50 text-red-800 font-mono font-bold py-3 px-6 rounded border-2 border-dashed border-red-400 text-lg">
                  MÃ: TET2026-${Math.floor(Math.random()*1000)}
                </div>
                <p class="text-xs text-red-500 mt-3 italic font-semibold">* Chụp màn hình để lưu mã!</p>
              </div>
            </div>
            <div class="text-white/60 text-xs mt-4 text-center">Bạn đã sử dụng lượt quay may mắn duy nhất.</div>
          `;
        }

        app.innerHTML = html;
      }

      init();
    </script>
</body>
</html>
